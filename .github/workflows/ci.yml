name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SeminarSched.WinUI.sln

      - name: Build
        run: dotnet build SeminarSched.WinUI.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test SeminarSched.WinUI.sln --configuration Release --no-build -p:Platform=x64 --logger "trx;LogFileName=tests.trx"

      - name: Privacy gate
        shell: pwsh
        run: ./scripts/Test-RepositoryPrivacy.ps1
